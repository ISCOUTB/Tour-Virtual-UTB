name: Contrato API

on:
  push:
    paths:
      - 'packages/contracts/**'
      - '.github/workflows/contrato.yml'
  pull_request:
    paths:
      - 'packages/contracts/**'
      - '.github/workflows/contrato.yml'

# El token de GitHub de estos jobs solo necesita leer el código.
permissions:
  contents: read

jobs:
  lint:
    name: Validar OpenAPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validar contrato
        run: npx --yes @redocly/cli@2.64.0 lint packages/contracts/openapi.yaml
