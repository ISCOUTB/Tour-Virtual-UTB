name: utb_tour
description: >-
  App de demostración del Tour Virtual UTB. Todo el módulo vive en
  packages/tour_virtual; esta app solo lo abre a pantalla completa, como lo
  haría la UTB APP, y es la que genera el APK y corre las pruebas.
publish_to: 'none'

# En Android, versionName y versionCode; en Windows, la versión del ejecutable.
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  tour_virtual:
    path: ../../packages/tour_virtual

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Las pruebas manejan directamente lo que el paquete usa por dentro.
  flutter_riverpod: ^2.6.1
  http: ^1.6.0
  shared_preferences: ^2.5.5

flutter:
  uses-material-design: true
