name: API backend

on:
  push:
    branches: [master]
    paths:
      - 'services/api/**'
      - '.github/workflows/api.yml'
  pull_request:
    paths:
      - 'services/api/**'
      - '.github/workflows/api.yml'

# El token de GitHub de estos jobs solo necesita leer el código.
permissions:
  contents: read

defaults:
  run:
    working-directory: services/api

jobs:
  verificar:
    name: Restaurar y compilar API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restaurar dependencias
        run: dotnet restore

      - name: Compilar
        run: dotnet build --no-restore --configuration Release

      # Falla si algún paquete NuGet, directo o transitivo, tiene una
      # vulnerabilidad publicada.
      - name: Buscar dependencias vulnerables
        run: |
          dotnet list package --vulnerable --include-transitive | tee vulnerables.txt
          ! grep -qi "following vulnerable packages" vulnerables.txt
