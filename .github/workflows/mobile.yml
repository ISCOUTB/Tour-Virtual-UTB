name: App movil

on:
  push:
    branches: [master, frontend-development, integration/backend-unification]
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/mobile.yml'
  pull_request:
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/mobile.yml'

defaults:
  run:
    working-directory: apps/mobile

jobs:
  verificar:
    name: Formato, analisis y pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolver dependencias
        run: flutter pub get

      - name: Generar codigo
        run: dart run build_runner build

      # Los archivos generados estan versionados. Si alguien cambia un modelo y
      # no regenera, esto lo detecta aqui y no en tiempo de ejecucion.
      - name: Verificar que el codigo generado esta al dia
        run: git diff --exit-code -- '*.g.dart' '*.freezed.dart'

      - name: Verificar formato
        run: dart format --output=none --set-exit-if-changed .

      - name: Analisis estatico
        run: flutter analyze --fatal-infos

      - name: Pruebas
        run: flutter test

  compilar-android:
    name: APK de debug
    runs-on: ubuntu-latest
    needs: verificar
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: dart run build_runner build
      - run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
