name: Frontend movil

# El modulo vive en packages/tour_virtual (lo que se incrusta en la UTB APP) y
# apps/mobile es la app de demostracion que lo abre, corre las pruebas y
# genera el APK. Un cambio en cualquiera de los dos verifica ambos.
# apps/levantamiento es la app secundaria del equipo para medir el campus: usa
# la lógica de navegación del módulo, así que también se verifica.
on:
  push:
    branches: [master]
    paths:
      - 'packages/tour_virtual/**'
      - 'apps/mobile/**'
      - 'apps/levantamiento/**'
      - 'scripts/grafo_campus.py'
      - 'scripts/test_grafo_campus.py'
      - 'scripts/aplicar_pines.py'
      - 'scripts/test_aplicar_pines.py'
      - 'scripts/preparar_modelo3d.py'
      - 'scripts/test_modelo3d.py'
      - '.github/workflows/mobile.yml'
  pull_request:
    paths:
      - 'packages/tour_virtual/**'
      - 'apps/mobile/**'
      - 'apps/levantamiento/**'
      - 'scripts/grafo_campus.py'
      - 'scripts/test_grafo_campus.py'
      - 'scripts/aplicar_pines.py'
      - 'scripts/test_aplicar_pines.py'
      - 'scripts/preparar_modelo3d.py'
      - 'scripts/test_modelo3d.py'
      - '.github/workflows/mobile.yml'

# El token de GitHub de estos jobs solo necesita leer el código.
permissions:
  contents: read

# Flutter fijo en 3.47.x, la ultima version con la que se verifico el modulo.
# La 3.50 marca como obsoleto package:flutter/material.dart (Material paso a
# material_ui) y --fatal-infos lo convierte en error en cada archivo; migrar
# romperia la 3.41 y la 3.47, y la UTB APP puede estar en cualquiera de ellas.
# Se sube cuando se sepa que version usa la UTB APP.

jobs:
  grafo:
    name: Importar datos de campo (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -I -m unittest discover -s scripts -p 'test_*.py' -v

  modulo:
    name: Modulo (formato, codigo generado y analisis)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/tour_virtual
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.x
          cache: true

      - name: Resolver dependencias
        run: flutter pub get

      - name: Generar codigo
        run: |
          dart run build_runner build
          flutter gen-l10n

      # Los archivos generados estan versionados. Si alguien cambia un modelo o
      # un texto de lib/l10n y no regenera, esto lo detecta aqui y no en tiempo
      # de ejecucion.
      - name: Verificar que el codigo generado esta al dia
        run: git diff --exit-code -- '*.g.dart' '*.freezed.dart' 'lib/l10n/*.dart'

      - name: Verificar formato
        run: dart format --output=none --set-exit-if-changed .

      - name: Analisis estatico
        run: flutter analyze --fatal-infos

  app:
    name: App de demostracion (analisis y pruebas)
    runs-on: ubuntu-latest
    needs: modulo
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.x
          cache: true

      - name: Resolver dependencias
        run: flutter pub get

      - name: Verificar formato
        run: dart format --output=none --set-exit-if-changed .

      - name: Analisis estatico
        run: flutter analyze --fatal-infos

      # Las pruebas del modulo viven aqui: una app que lo usa como dependencia
      # pide sus recursos con el prefijo packages/tour_virtual/, igual que la
      # UTB APP.
      - name: Pruebas
        run: flutter test

  levantamiento:
    name: App de levantamiento (analisis y pruebas)
    runs-on: ubuntu-latest
    needs: modulo
    defaults:
      run:
        working-directory: apps/levantamiento
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.x
          cache: true

      - name: Resolver dependencias
        run: flutter pub get

      - name: Verificar formato
        run: dart format --output=none --set-exit-if-changed .

      - name: Analisis estatico
        run: flutter analyze --fatal-infos

      - name: Pruebas
        run: flutter test

  compilar-android:
    name: APK de debug (${{ matrix.app }})
    runs-on: ubuntu-latest
    needs: [app, levantamiento]
    strategy:
      matrix:
        app: [mobile, levantamiento]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.x
          cache: true

      - run: flutter pub get
      - name: Preparar maqueta 3D del campus
        run: python ../../scripts/preparar_modelo3d.py
      - run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-debug-apk
          path: apps/${{ matrix.app }}/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
